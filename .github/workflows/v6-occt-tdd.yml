name: V6 OCCT TDD

on:
  push:
    branches:
      - v6-occt-tdd
  pull_request:
    branches:
      - main
      - v6-occt-tdd

jobs:
  rust-occt:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OCCT and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libtbb-dev \
            libocct-foundation-dev \
            libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev \
            libocct-visualization-dev

      - name: Verify OCCT development files
        run: |
          test -f /usr/include/opencascade/NCollection_AliasedArray.hxx
          test -e /usr/lib/x86_64-linux-gnu/libtbb.so
          dpkg-query -W libocct-foundation-dev libocct-visualization-dev libtbb-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy

      - name: Format gate
        working-directory: rust
        run: cargo fmt --all

      - name: Test gate (debug)
        working-directory: rust
        run: cargo test --workspace --all-targets

      - name: Test gate (release)
        working-directory: rust
        run: cargo test --workspace --all-targets --release

      - name: Clippy gate
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Kernel format gate
        working-directory: kernel_rust
        run: cargo fmt --all -- --check

      - name: Kernel test gate (debug)
        working-directory: kernel_rust
        run: cargo test --all-targets

      - name: Kernel test gate (release)
        working-directory: kernel_rust
        run: cargo test --all-targets --release

      - name: Kernel clippy gate
        working-directory: kernel_rust
        run: cargo clippy --all-targets -- -D warnings
